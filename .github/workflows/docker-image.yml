name: Subir Movieflix

on:
  push:
    branches: [ "main" ]
    
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fazer checkout
      uses: actions/checkout@v4
    
    - name: Build com Docker Compose
      run: docker compose build
    
    - name: Subir containers
      run: docker compose up -d
